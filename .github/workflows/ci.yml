name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift package
        run: swift test
        working-directory: packages/ios

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests
        working-directory: packages/android
        run: |
          if [ -f gradlew ]; then
            ./gradlew :richtext-android:testDebugUnitTest
          else
            echo "Generate the Gradle wrapper before running Android CI."
          fi
